# SK Firma za reverse proxy (Caddy, nginx, Synology DSM…), bez Cloudflare Tunnel.
# Proxy musí pridávať IP klienta na koniec X-Forwarded-For (TRUST_PROXY=xff).
# Príklad pre Synology: README.sk.md → „Nasadenie na Synology (DSM reverse proxy)".
#
# Tok: internet → reverse proxy (HTTPS) → http://localhost:8080 → tento kontajner

services:
  skfirma:
    image: ghcr.io/carnaby/sk-firma-mcp:latest
    container_name: skfirma
    restart: unless-stopped
    # Watchtower na serveri sleduje len kontajnery s týmto labelom:
    # nový :latest po pushi do main nasadí do ~5 min, volume s indexom ostáva.
    labels: ['com.centurylinklabs.watchtower.enable=true']
    ports:
      # len na localhost hostiteľa: dnu sa ide výhradne cez reverse proxy.
      # Na 0.0.0.0 by sa dal z LAN obísť proxy aj podvrhnúť X-Forwarded-For.
      - "127.0.0.1:8080:8080"
    volumes:
      # pomenovaný volume, nie ./data — Docker mu nastaví správneho vlastníka
      # (kontajner beží ako neprivilegovaný user), bind mount s iným vlastníkom by
      # skončil s „permission denied" pri ingeste
      - skfirma-data:/data
    environment:
      TZ: Europe/Bratislava
      # reverse proxy (Caddy, nginx, DSM) pridáva IP klienta na koniec X-Forwarded-For
      TRUST_PROXY: xff
      # Limity — defaulty sú rozumné, odkomentuj len ak treba
      # RATE_LIMIT_API_PER_MINUTE: "20"
      # RATE_LIMIT_API_PER_DAY: "300"   # spolu web aj MCP
      # RATE_LIMIT_MCP_PER_MINUTE: "60"
      # RATE_LIMIT_MCP_PER_DAY: "1500"
      # RATE_LIMIT_TOOLS_PER_MINUTE: "20"
      # RATE_LIMIT_NET_PER_DAY: "3000"
      # SKFIRMA_ADMIN_TOKEN: "dlhy-nahodny-retazec"   # detailný /api/health
      # SKFIRMA_UPSTREAM_DAILY_BUDGET: "20000"
      # SKFIRMA_UPSTREAM_MAX_QUEUE: "20"

volumes:
  skfirma-data:
