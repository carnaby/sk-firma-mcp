# SK Firma na NAS / domácom serveri — variant s Cloudflare Tunnel.
#
# Pred prvým spustením vlož do TUNNEL_TOKEN token z Cloudflare
# (postup v README.sk.md → „Nasadenie na Synology (DSM reverse proxy)", variant Cloudflare Tunnel). Bez tunela beží web len v LAN
# na http://<ip-nas>:8080 — vtedy blok `cloudflared` zmaž a TRUST_PROXY
# nastav na "none".

services:
  skfirma:
    image: ghcr.io/carnaby/sk-firma-mcp:latest
    container_name: skfirma
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # pomenovaný volume, nie ./data — Docker mu nastaví správneho vlastníka
      # (kontajner beží ako neprivilegovaný user), na NAS by bind mount
      # skončil s „permission denied" pri ingeste
      - skfirma-data:/data
    environment:
      TZ: Europe/Bratislava
      # IP klienta pre limity berieme z hlavičky CF-Connecting-IP
      TRUST_PROXY: cloudflare
      # Limity — defaulty sú rozumné, odkomentuj len ak treba
      # RATE_LIMIT_API_PER_MINUTE: "20"
      # RATE_LIMIT_API_PER_DAY: "300"
      # RATE_LIMIT_MCP_PER_MINUTE: "60"
      # RATE_LIMIT_MCP_PER_DAY: "1500"
      # SKFIRMA_UPSTREAM_DAILY_BUDGET: "20000"
      # SKFIRMA_UPSTREAM_MAX_QUEUE: "20"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skfirma-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "SEM-VLOZ-TOKEN-Z-CLOUDFLARE"
    depends_on:
      - skfirma

volumes:
  skfirma-data:
